name: Python Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Run Python Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run codebase-context-generator tests
        run: python -m unittest discover -s codebase-context-generator/tests -p "test_*.py" -v

      - name: Run slack-cli tests
        run: python -m unittest discover -s slack-cli/tests -p "test_*.py" -v

      - name: Run yt-random-comment-picker tests
        run: python -m unittest discover -s yt-random-comment-picker/tests -p "test_*.py" -v
