name: CI & Security

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Run Python Tests (3.14)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run codebase-context-generator tests
        run: python -m unittest discover -s codebase-context-generator/tests -p "test_*.py" -v

      - name: Run slack-cli tests
        run: python -m unittest discover -s slack-cli/tests -p "test_*.py" -v

      - name: Run yt-random-comment-picker tests
        run: python -m unittest discover -s yt-random-comment-picker/tests -p "test_*.py" -v

  security:
    name: Security & Vulnerability Scan (3.14)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install security scanners
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit

      - name: Scan dependencies for known CVEs (pip-audit)
        run: pip-audit -r requirements.txt

      - name: Run Python SAST code security audit (bandit)
        run: bandit -r codebase-context-generator/ slack-cli/ yt-random-comment-picker/ -ll -x "*/tests/*"
